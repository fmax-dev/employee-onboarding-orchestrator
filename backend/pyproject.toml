[project]
name = "backend"
version = "0.1.0"
description = "Orchestrates account provisioning across Slack, GitHub, and AWS."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
]

[tool.uv]
# Project lives in a OneDrive folder where hardlinking from uv's cache fails
# (os error 396). Copy files into .venv instead.
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
